# Usuarios, vhost y permisos que se cargan al arrancar (Guía 2.3.1)
management.load_definitions = /etc/rabbitmq/definitions/definitions.json

# Clustering automático: cada nodo conoce la lista de nodos del clúster
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2

# Tiempo de espera para que los nodos se descubran
cluster_formation.node_cleanup.interval = 10000

# Reparte las colas nuevas entre los nodos (en RabbitMQ 4 reemplaza a queue_master_location de la guía)
queue_leader_locator = balanced
