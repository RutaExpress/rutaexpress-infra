# CI: valida la sintaxis de los compose en cada PR (con valores de ejemplo, sin secretos reales)
name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    name: Validar docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar mq/compose.yml
        working-directory: mq
        run: |
          cp .env.example .env
          docker compose config --quiet
          python3 -m json.tool definitions.template.json > /dev/null
          echo "mq: compose y definitions válidos"

      - name: Validar apps/compose.aws.yml
        working-directory: apps
        run: |
          cp .env.example .env
          docker compose -f compose.aws.yml config --quiet --no-path-resolution
          echo "apps: compose válido"

      - name: Validar plantilla CloudFormation (cfn-lint)
        run: |
          pip install --quiet cfn-lint
          cfn-lint cloudformation/rutaexpress-stack.yaml
          echo "cloudformation: plantilla válida"
