# Microservicios RutaExpress + Oracle (ec2-apps). RabbitMQ es el clúster de mq/ (otra máquina)
# Secretos y datos del despliegue en .env (no se sube a GitHub). Imágenes construidas desde cada repo.
x-rabbit: &rabbit
  RABBITMQ_ADDRESSES: ${MQ_HOST:?Falta MQ_HOST en .env}:5672,${MQ_HOST}:5673
  RABBITMQ_VHOST: rutaexpress

x-java: &java
  JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xms128m -Xmx384m}

# Garantiza que host.docker.internal exista dentro del contenedor (Docker Desktop y Linux)
x-hosts: &hosts
  - "host.docker.internal:host-gateway"

services:

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: rx-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Falta ORACLE_PASSWORD en .env}
      ORACLE_DATABASE: ORCLPDB1
      APP_USER: SHIPMENTS_USER
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Falta APP_USER_PASSWORD en .env}
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
    # Sin puertos publicados: solo shipments llega a Oracle por la red interna

  shipments:
    build: ${REPO_SHIPMENTS:-../../ms-rutaexpress-shipments}/ms-rutaexpress-shipments
    container_name: rx-shipments
    restart: unless-stopped
    extra_hosts: *hosts
    environment:
      <<: [*rabbit, *java]
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle:1521/ORCLPDB1
      SPRING_DATASOURCE_USERNAME: SHIPMENTS_USER
      SPRING_DATASOURCE_PASSWORD: ${APP_USER_PASSWORD}
      RABBITMQ_USER: rx-shipments
      RABBITMQ_PASSWORD: ${RX_SHIPMENTS_PASSWORD:?Falta RX_SHIPMENTS_PASSWORD en .env}
    ports:
      - "127.0.0.1:8081:8081"     # solo desde la propia máquina (pruebas); desde afuera se entra por el BFF
    depends_on:
      oracle:
        condition: service_healthy

  bff:
    build: ${REPO_BFF:-../../ms-rutaexpress-bff}/ms-rutaexpress-bff
    container_name: rx-bff
    restart: unless-stopped
    environment:
      <<: *java
      SHIPMENTS_URL: http://shipments:8081
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8082:8082"               # lo llama el API Gateway
    depends_on:
      - shipments

  notify:
    build: ${REPO_NOTIFY:-../../ms-rutaexpress-notify}/ms-rutaexpress-notify
    container_name: rx-notify
    restart: unless-stopped
    extra_hosts: *hosts
    environment:
      <<: [*rabbit, *java]
      RABBITMQ_USER: rx-notify
      RABBITMQ_PASSWORD: ${RX_NOTIFY_PASSWORD:?Falta RX_NOTIFY_PASSWORD en .env}
      NOTIFY_SMTP_FAIL_FIRST: ${NOTIFY_SMTP_FAIL_FIRST:-0}          # simulador de fallas (0 = apagado)
      NOTIFY_DLQ_ALERT_ENABLED: ${NOTIFY_DLQ_ALERT_ENABLED:-true}   # false = los fallidos quedan en la DLQ

  rabbit-admin:
    build: ${REPO_ADMIN:-../../ms-rutaexpress-rabbit-admin}/ms-rutaexpress-rabbit-admin
    container_name: rx-rabbit-admin
    restart: unless-stopped
    extra_hosts: *hosts
    environment:
      <<: [*rabbit, *java]
      RABBITMQ_USER: rx-ops
      RABBITMQ_PASSWORD: ${RX_OPS_PASSWORD:?Falta RX_OPS_PASSWORD en .env}
    ports:
      - "8085:8085"               # en AWS el Security Group lo abre solo a la IP del administrador

  # frontend: se agrega cuando el front tenga su Dockerfile (nginx HTTPS, puerto 443)

volumes:
  oracle_data:
